<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="0.15" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#d9f5f1"/>
      <stop offset="0.6" stop-color="#fafbfc"/>
      <stop offset="1" stop-color="#f1f4f8"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#cbd5e1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="630" fill="url(#fade)"/></mask>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#m)"/>

  <!-- brand -->
  <g transform="translate(72,64)">
    <rect width="64" height="64" rx="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <g transform="scale(0.125)">
      <circle cx="256" cy="256" r="136" fill="none" stroke="#0f172a" stroke-width="24"/>
      <path d="M180 338V174L332 338V174" fill="none" stroke="#0f172a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="366" cy="194" r="18" fill="#06b6d4" stroke="#ffffff" stroke-width="8"/>
    </g>
    <text x="82" y="46" font-family="JetBrains Mono" font-weight="700" font-size="36" fill="#0f172a">nex</text>
  </g>

  <!-- headline -->
  <text font-family="Figtree" font-weight="700" font-size="58" fill="#0f172a" letter-spacing="-1.2">
    <tspan x="72" y="236">Write code that</tspan>
    <tspan x="72" y="304">keeps its <tspan fill="#0b7d7c">promises</tspan></tspan>
  </text>
  <text font-family="Figtree" font-weight="500" font-size="25" fill="#55637a">
    <tspan x="72" y="372">A small language for learning to program</tspan>
    <tspan x="72" y="406">and to engineer software properly.</tspan>
  </text>
  <g font-family="JetBrains Mono" font-weight="500" font-size="19" fill="#55637a">
    <text x="72" y="540">Free books · Open source · schemer.in/nex</text>
  </g>

  <!-- code window -->
  <g transform="translate(632,92)" filter="url(#shadow)">
    <rect width="500" height="446" rx="16" fill="#0f172a"/>
    <circle cx="26" cy="26" r="7" fill="#ff5f57"/><circle cx="48" cy="26" r="7" fill="#febc2e"/><circle cx="70" cy="26" r="7" fill="#28c840"/>
    <text x="250" y="31" text-anchor="middle" font-family="JetBrains Mono" font-size="15" fill="#93a4c0">wallet.nex</text>
    <g font-family="JetBrains Mono" font-size="18" fill="#e2e8f0" xml:space="preserve" style="font-variant-ligatures:none;font-feature-settings:'calt' 0,'liga' 0">
      <text x="26" y="84">spend(amount: <tspan fill="#5eead4">Real</tspan>)</text>
      <text x="26" y="114"><tspan fill="#f472b6">require</tspan></text>
      <text x="26" y="144">  enough: amount</text><text x="209.6" y="144">&lt;</text><text x="220.4" y="144">= money</text>
      <text x="26" y="174"><tspan fill="#f472b6">do</tspan></text>
      <text x="26" y="204">  this.money := money - amount</text>
      <text x="26" y="234"><tspan fill="#f472b6">ensure</tspan></text>
      <text x="26" y="264">  decreased:</text>
      <text x="26" y="294">    money = <tspan fill="#f472b6">old</tspan> money - amount</text>
      <text x="26" y="324"><tspan fill="#f472b6">end</tspan></text>
      <text x="26" y="368" fill="#93a4c0">&gt; w.spend(<tspan fill="#fbbf24">20.0</tspan>)</text>
    </g>
    <rect x="18" y="388" width="464" height="40" rx="8" fill="#e11d48" fill-opacity="0.16" stroke="#fb7185" stroke-opacity="0.5"/>
    <text x="34" y="414" font-family="JetBrains Mono" font-size="16.5" fill="#fda4af"><tspan font-weight="700">Error:</tspan> Precondition violation: <tspan font-weight="700">enough</tspan></text>
  </g>
</svg>
