<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#d9f5f1"/>
      <stop offset="0.6" stop-color="#fafbfc"/>
      <stop offset="1" stop-color="#f1f4f8"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#cbd5e1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="630" fill="url(#fade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#dots)" mask="url(#m)"/>

  <!-- logo mark (orbit N), top right -->
  <g transform="translate(838,22) scale(0.62)">
    <circle cx="256" cy="256" r="136" fill="none" stroke="#0f172a" stroke-width="24"/>
    <path d="M180 338V174L332 338V174" fill="none" stroke="#0f172a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="366" cy="194" r="18" fill="#06b6d4" stroke="#fafbfc" stroke-width="8"/>
  </g>

  <!-- wordmark, as in the page hero -->
  <text x="62" y="262" font-family="Figtree" font-weight="800" font-size="216" letter-spacing="-10" fill="#0b7d7c">Nex</text>

  <!-- tagline -->
  <text font-family="Figtree" font-weight="700" font-size="45" fill="#0f172a" letter-spacing="-0.5">
    <tspan x="72" y="384">A multi-paradigm, <tspan fill="#0b7d7c">specification-first</tspan> language</tspan>
    <tspan x="72" y="442">for designing software in the age of AI.</tspan>
  </text>

  <!-- footer line -->
  <line x1="72" y1="516" x2="1128" y2="516" stroke="#e2e8f0" stroke-width="2"/>
  <g font-family="JetBrains Mono" font-weight="500" font-size="21" fill="#55637a">
    <text x="72" y="566">Focused · Design by Contract · Made for AI · Runs on the JVM</text>
    <text x="1128" y="566" text-anchor="end">schemer.in/nex.html</text>
  </g>
</svg>
