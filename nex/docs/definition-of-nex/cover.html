<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Definition of Nex</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --stage:      #ece7e6;
      --paper:      #fbfbfc;
      --ink:        #0a0a0b;
      --ink-mid:    #3d3d40;
      --ink-faint:  #6b6b6f;
      --rule:       #e6dcda;
      --accent:     #8a2f2f;
      --font-body:  'EB Garamond', Georgia, serif;
      --font-ui:    'Outfit', system-ui, sans-serif;
      --font-mono:  'JetBrains Mono', ui-monospace, monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-font-smoothing: antialiased; }

    body{
      background: var(--stage);
      color: var(--ink);
      font-family: var(--font-ui);
      min-height: 100vh;
      display:flex;
      justify-content:center;
      align-items: center;
      padding: clamp(1.5rem, 5vw, 4rem) 1rem;
    }

    .stage-wrap{
      width:100%;
      max-width: 30rem;
    }

    .cover{
      position:relative;
      background: var(--paper);
      border-radius: 2px;
      box-shadow:
        0 1px 0 rgba(255,255,255,0.6) inset,
        0 24px 48px -16px rgba(30,14,13,0.28),
        0 4px 12px -4px rgba(30,14,13,0.18);
      overflow: hidden;
      display:flex;
      flex-direction:column;
    }

    .head{
      padding: clamp(2rem,7vw,3.25rem) clamp(1.75rem,6vw,3rem) 0.5rem;
    }

    .eyebrow{
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.1rem;
    }

    .wordmark{
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(2.6rem, 9.5vw, 3.6rem);
      line-height: 1.04;
      letter-spacing: -0.01em;
      color: var(--ink);
    }
    .wordmark em{
      font-style: italic;
      color: var(--accent);
    }

    .dek{
      font-family: var(--font-body);
      font-style: italic;
      font-size: clamp(0.95rem, 2.6vw, 1.05rem);
      color: var(--ink-faint);
      line-height: 1.5;
      max-width: 36ch;
      margin-top: 1.15rem;
    }

    /* Plate — a public-domain Alphonse Legros etching */
    .plate-wrap{
      margin: 1.35rem clamp(1.75rem,6vw,3rem) 1.5rem;
    }

    .plate{
      display: block;
      position: relative;
      aspect-ratio: 900 / 377;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .plate:hover{
      transform: translateY(-1px);
    }

    .plate img{
      position:absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: grayscale(1) contrast(1.1) brightness(1.02);
      mix-blend-mode: luminosity;
    }
    .plate::after{
      content:'';
      position:absolute; inset:0;
      background: var(--accent);
      mix-blend-mode: color;
      opacity: 0.88;
    }

    .foot{
      margin-top: auto;
      padding: 1.1rem clamp(1.75rem,6vw,3rem) clamp(1.5rem,5vw,2.25rem);
      border-top: 1px solid var(--rule);
      display:flex;
      align-items:baseline;
      justify-content:space-between;
      gap: 1rem;
    }
    .author{
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: var(--ink-mid);
    }
    .book-link{
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s;
    }
    .book-link:hover{ color: var(--ink-mid); }
  </style>
</head>
<body>

<div class="stage-wrap">
  <div class="cover">
    <div class="head">
      <div class="eyebrow">A Formal Language Specification</div>
      <div class="wordmark">The Definition of <em>Nex</em></div>
      <p class="dek">A precise account of both the grammar and the meaning of the language — the prerequisite for its implementation and its use.</p>
    </div>

    <div class="plate-wrap">
      <a class="plate" href="index.html" aria-label="Go to contents">
        <img src="images/cover-barraud.webp" alt="Lithograph after Charles Decimus Barraud of Horowhenua Lake, showing whare on the shore, canoes on the water, and mountains beyond">
      </a>
    </div>

    <div class="foot">
      <div class="author">Vijay Mathew</div>
      <a class="book-link" href="index.html">Contents →</a>
    </div>
  </div>
</div>

</body>
</html>
